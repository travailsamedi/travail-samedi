<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Travail Samedi">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="manifest" href="manifest.json">
  <title>Travail Samedi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #6366f1; }
    iframe { width: 100%; height: 100%; border: 0; display: block; }
    .loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: white; z-index: 9999;
      transition: opacity 0.5s;
    }
    .loading.hide { opacity: 0; pointer-events: none; }
    .loading-icon { font-size: 60px; margin-bottom: 20px; animation: pulse 1.5s ease-in-out infinite; }
    .loading-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .loading-sub { font-size: 13px; opacity: 0.85; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-icon">📊</div>
    <div class="loading-title">Travail Samedi</div>
    <div class="loading-sub">جاري التحميل...</div>
  </div>
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbz0b01LCEFwxpQwNWSPaI8-x7H2WuyKts2siXNV9_W6rV_67IdnIKCTarFXMj6-MG0OkA/exec" allow="clipboard-read; clipboard-write"></iframe>
  <script>
    document.getElementById('appFrame').onload = function() {
      setTimeout(function() {
        document.getElementById('loading').classList.add('hide');
      }, 1500);
    };
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
