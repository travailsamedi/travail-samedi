<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Travail Samedi">
    <link rel="manifest" href="manifest.json">
    <title>Travail Samedi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6366f1, #7c3aed);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .loader { font-size: 16px; }
        .icon { font-size: 60px; margin-bottom: 20px; animation: pulse 1.5s ease-in-out infinite; }
        .title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .sub { font-size: 13px; opacity: 0.85; margin-bottom: 30px; }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.25);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="icon">📊</div>
        <div class="title">Travail Samedi</div>
        <div class="sub">جاري فتح التطبيق...</div>
        <div class="spinner"></div>
    </div>

    <script>
        var appUrl = "https://script.google.com/macros/s/AKfycbz0b01LCEFwxpQwNWSPaI8-x7H2WuyKts2siXNV9_W6rV_67IdnIKCTarFXMj6-MG0OkA/exec";
        setTimeout(function() {
            window.location.replace(appUrl);
        }, 800);
    </script>
</body>
</html>
